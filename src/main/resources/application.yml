spring:
  application:
    name: grantfit

  # 로컬 개발용 환경변수를 .env 파일에서 읽는다.
  # 파일이 없으면 무시하고 OS 환경변수를 사용한다. (운영/CI 대응)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: grantfit-pool
      maximum-pool-size: 10
      connection-timeout: 5000

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.grantfit
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

# 기업마당 지원사업정보 API (README §7)
bizinfo:
  base-url: https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do
  api-key: ${BIZINFO_API_KEY:}

# Gemini API (README §8, §9) — generateContent + Structured Output
gemini:
  base-url: https://generativelanguage.googleapis.com/v1beta
  model: ${GEMINI_MODEL:gemini-3.8-flash}
  api-key: ${GEMINI_API_KEY:}
  timeout-seconds: 60
  # 일시적 오류(TIMEOUT, RATE_LIMIT, 5xx, NETWORK_ERROR) 재시도 (MILESTONE 3)
  retry:
    max-attempts: 3            # 최초 1회 + 재시도 2회
    initial-backoff-millis: 1000
    max-wait-seconds: 30       # 429 retryDelay 가 이보다 길면 재시도하지 않는다
  batch:
    interval-millis: 1000      # 일괄 분석 시 공고 사이 간격

# AI 정확도 측정 (MILESTONE 4). 경로는 실행 디렉터리(프로젝트 루트) 기준
evaluation:
  golden-path: evaluation/golden-dataset.json

logging:
  level:
    com.grantfit: DEBUG
